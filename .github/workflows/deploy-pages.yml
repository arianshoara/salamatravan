name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: my-telegram-webapp/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci
        working-directory: my-telegram-webapp

      - name: Test
        run: npm test
        working-directory: my-telegram-webapp

      - name: Build for repository path
        run: npm run build -- --base=/salamatravan/
        working-directory: my-telegram-webapp

      - name: Add single-page-app fallback
        run: cp dist/index.html dist/404.html
        working-directory: my-telegram-webapp

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: my-telegram-webapp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
